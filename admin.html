<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FORKTV7 - Admin Panel</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            /* Premium Dark Theme */
            --bg-base: #050505;
            --bg-surface: #0a0a0c;
            --bg-surface-2: #121217;
            --border-color: rgba(255, 255, 255, 0.08);
            
            /* Typography Colors */
            --text-primary: #f8fafc;
            --text-secondary: #8b949e;
            --text-muted: #525866;
            
            /* Accents */
            --primary-purple: #8B5CF6;
            --purple-light: #A78BFA;
            --purple-glow: rgba(139, 92, 246, 0.15);
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
            
            /* Metrics */
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, var(--purple-glow), transparent 50%);
            background-attachment: fixed;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        /* ================= SPA VIEW STATES ================= */
        .view {
            display: none;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        .view.active {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* ================= 1. LOGIN SCREEN ================= */
        #login-view {
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid var(--border-color);
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
        }

        .login-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary-purple), var(--purple-light));
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 800; color: #fff;
            margin: 0 auto 24px auto;
            box-shadow: 0 10px 25px var(--purple-glow);
        }

        .login-card h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
        .login-card p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 32px; }

        .input-group-auth {
            position: relative;
            margin-bottom: 24px;
        }
        .input-group-auth i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-secondary); font-size: 20px;
        }
        .input-group-auth input {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            padding: 16px 16px 16px 48px;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem; outline: none; transition: 0.3s;
        }
        .input-group-auth input:focus {
            border-color: var(--primary-purple);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }

        .btn-login {
            width: 100%; padding: 16px;
            background: var(--text-primary); color: var(--bg-base);
            border: none; border-radius: var(--radius-md);
            font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-login:hover { background: #e2e8f0; transform: translateY(-2px); }

        /* ================= 2. DASHBOARD NAV ================= */
        .topbar {
            height: 70px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(16px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px;
            position: sticky; top: 0; z-index: 50;
        }

        .topbar-brand { display: flex; align-items: center; gap: 12px; }
        .logo-mini {
            background: var(--primary-purple); width: 34px; height: 34px;
            border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 14px; box-shadow: 0 2px 10px var(--purple-glow);
        }
        .topbar-brand span { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.2px; }

        .topbar-user { display: flex; align-items: center; gap: 20px; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); }
        .user-info i { font-size: 22px; color: var(--text-primary); }
        .user-info span { color: var(--text-primary); }

        .btn-logout {
            background: rgba(239, 68, 68, 0.1); color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-logout:hover { background: var(--danger); color: #fff; }

        /* ================= DASHBOARD GRID ================= */
        .dashboard-container {
            max-width: 1400px; margin: 0 auto; width: 100%;
            padding: 32px;
            display: grid; 
            grid-template-columns: 360px 1fr;
            gap: 24px;
            align-items: start; /* Prevents stretching */
        }

        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex; flex-direction: column;
        }
        
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .panel-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .panel-title i { color: var(--primary-purple); font-size: 22px; }

        /* Form Elements */
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: flex; justify-content: space-between;
            font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600;
        }
        .helper-text { font-size: 0.75rem; color: var(--primary-purple); }

        input, textarea, select {
            width: 100%; background: var(--bg-surface-2);
            border: 1px solid var(--border-color); color: var(--text-primary);
            padding: 14px 16px; border-radius: var(--radius-md); font-size: 0.95rem; outline: none; transition: 0.2s;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary-purple); background: rgba(255,255,255,0.05);
        }

        /* Combined Input (Prefix) */
        .input-group { display: flex; align-items: stretch; }
        .input-group-prefix {
            background: var(--bg-base); border: 1px solid var(--border-color);
            border-right: none; padding: 14px 16px; border-radius: var(--radius-md) 0 0 var(--radius-md);
            color: var(--text-secondary); font-size: 0.95rem; font-weight: 500;
            display: flex; align-items: center;
        }
        .input-group input { border-radius: 0 var(--radius-md) var(--radius-md) 0; }

        /* Buttons */
        .btn {
            padding: 14px 20px; border: none; border-radius: var(--radius-md);
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; width: 100%;
        }
        .btn-primary { background: var(--primary-purple); color: #fff; }
        .btn-primary:hover { background: #7c3aed; transform: translateY(-2px); box-shadow: 0 4px 15px var(--purple-glow); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-warning:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* ================= LIST UI ================= */
        .list-container {
            display: flex; flex-direction: column; gap: 12px;
            max-height: 550px; overflow-y: auto; padding-right: 6px; margin-bottom: 20px;
        }
        .list-item {
            background: var(--bg-surface-2); border: 1px solid var(--border-color);
            padding: 18px; border-radius: var(--radius-md); 
            display: flex; justify-content: space-between; align-items: flex-start; 
            transition: 0.2s; gap: 16px;
        }
        .list-item:hover { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.03); }
        
        .item-info { flex: 1; min-width: 0; }
        .item-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
        .item-info h4 { font-size: 1.05rem; font-weight: 600; color: #fff; line-height: 1.2; }
        .item-info p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.4; }
        
        .item-badge {
            font-size: 0.65rem; font-weight: 700; padding: 4px 8px; border-radius: 6px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-script { background: rgba(139, 92, 246, 0.15); color: var(--purple-light); }
        .badge-loadstring { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }

        .item-path { 
            font-size: 0.8rem; color: var(--primary-purple); font-family: 'Fira Code', monospace; 
            display: inline-flex; align-items: center; gap: 6px; background: rgba(139, 92, 246, 0.05);
            padding: 6px 10px; border-radius: 6px; word-break: break-all; border: 1px dashed rgba(139, 92, 246, 0.2);
        }

        .item-actions { display: flex; gap: 8px; }
        .item-actions button {
            background: var(--bg-base); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); color: var(--text-primary); font-size: 1.2rem;
            cursor: pointer; padding: 10px; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .edit-btn:hover { color: var(--warning); border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.1); }
        .del-btn:hover { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1); }

        /* Manual Import Area */
        .import-area {
            border-top: 1px solid var(--border-color); padding-top: 16px;
        }
        .import-area label { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 10px; display:block; font-weight: 500;}
        .import-box { display: flex; gap: 10px; }

        /* ================= JSON OUTPUT ================= */
        .json-panel { grid-column: 1 / -1; }
        .json-header-actions { display: flex; gap: 12px; }
        .json-header-actions button {
            padding: 8px 16px; font-size: 0.85rem; border-radius: var(--radius-sm); width: auto; font-weight: 600;
        }
        .json-output {
            background: #09090b; border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 20px; font-family: 'Fira Code', monospace; font-size: 0.85rem;
            color: #34d399; max-height: 400px; overflow-y: auto; overflow-x: auto; line-height: 1.6;
            white-space: pre;
        }

        /* ================= RESPONSIVE DESIGN ================= */
        
        /* TABLET (Max 1024px) */
        @media (max-width: 1024px) {
            .dashboard-container {
                grid-template-columns: 1fr; /* Stack vertically */
                gap: 24px;
            }
        }

        /* MOBILE (Max 768px) */
        @media (max-width: 768px) {
            .topbar { padding: 0 20px; height: 65px; }
            .topbar-brand span { display: none; } /* Hide text, show only logo to save space */
            .user-info span { display: none; } /* Hide username text */
            
            .dashboard-container { padding: 16px; gap: 16px; }
            .panel { padding: 20px; }
            
            /* Ubah List item menjadi stack di HP */
            .list-item { flex-direction: column; }
            .item-actions { 
                width: 100%; 
                display: grid; 
                grid-template-columns: 1fr 1fr; /* Tombol Edit/Delete bersebelahan penuh */
                margin-top: 8px;
            }
            .item-actions button { padding: 12px; font-size: 1.3rem; } /* Tombol lebih besar untuk jari */

            .import-box { flex-direction: column; }
            .import-box button { width: 100%; }

            .json-header-actions { flex-direction: column; width: 100%; }
            .json-header-actions button { width: 100%; }
            .panel-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .json-panel .panel-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- ================= 1. LOGIN SCREEN ================= -->
    <div id="login-view" class="view active">
        <div class="login-card">
            <div class="login-logo">F7</div>
            <h1>FORKTV7</h1>
            <p>Admin Studio Authentication</p>
            
            <div class="input-group-auth">
                <i class="ph-bold ph-user"></i>
                <input type="text" id="usernameInput" placeholder="Enter Username..." autocomplete="off" onkeypress="handleEnter(event)">
            </div>
            
            <button class="btn-login" onclick="handleLogin()">
                Access Dashboard <i class="ph-bold ph-arrow-right"></i>
            </button>
        </div>
    </div>


    <!-- ================= 2. ADMIN DASHBOARD ================= -->
    <div id="admin-view" class="view">
        
        <!-- Top Navigation -->
        <nav class="topbar">
            <div class="topbar-brand">
                <div class="logo-mini">F7</div>
                <span>FORKTV7 Admin</span>
            </div>
            <div class="topbar-user">
                <div class="user-info">
                    <i class="ph-fill ph-user-circle"></i>
                    <span id="displayUsername">Admin</span>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="ph-bold ph-sign-out"></i> <span>Logout</span>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="dashboard-container">
            
            <!-- COLUMN 1: ENTRY FORM -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title"><i class="ph-fill ph-pencil-line"></i> Entry Data</h2>
                </div>
                
                <form id="dataForm">
                    <input type="hidden" id="editIndex" value="-1">
                    
                    <div class="form-group">
                        <label>Execution Type</label>
                        <select id="inputType" onchange="toggleFields()">
                            <option value="script">Local File (.lua)</option>
                            <option value="loadstring">Remote Code (Loadstring)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Title / Script Name</label>
                        <input type="text" id="inputTitle" placeholder="Ex: Auto Farm V2" required>
                    </div>

                    <div class="form-group">
                        <label>Description (Optional)</label>
                        <input type="text" id="inputDesc" placeholder="Brief explanation">
                    </div>

                    <!-- Input Local File -->
                    <div class="form-group" id="fieldFile">
                        <label>
                            <span>Filename (.lua)</span>
                            <span class="helper-text">Auto prefix 'data/'</span>
                        </label>
                        <div class="input-group">
                            <div class="input-group-prefix">data/</div>
                            <input type="text" id="inputFile" placeholder="Ex: autofarm.lua">
                        </div>
                    </div>

                    <!-- Input Loadstring -->
                    <div class="form-group" id="fieldCode" style="display: none;">
                        <label>Loadstring URL/Code</label>
                        <textarea id="inputCode" rows="4" placeholder="loadstring(game:HttpGet('...'))()"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="ph-bold ph-plus-circle"></i> Add to Config
                    </button>
                    <button type="button" class="btn btn-outline" style="margin-top: 12px; display: none;" id="cancelBtn" onclick="resetForm()">
                        Cancel Edit
                    </button>
                </form>
            </div>

            <!-- COLUMN 2: ACTIVE LIST -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title"><i class="ph-fill ph-list-bullets"></i> Active Configurations</h2>
                    <span style="font-size: 0.8rem; font-weight:600; background: var(--bg-surface-2); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border-color);" id="totalItems">0 Items</span>
                </div>
                
                <div class="list-container" id="listContainer">
                    <!-- Data List Injected Here -->
                </div>
                
                <!-- Manual Import -->
                <div class="import-area">
                    <label>Import Config from JSON Code:</label>
                    <div class="import-box">
                        <input type="text" id="importInput" placeholder='Paste JSON array [...]'>
                        <button class="btn btn-outline" style="width: 120px;" onclick="importJSON()">Import</button>
                    </div>
                </div>
            </div>

            <!-- COLUMN 3 (FULL WIDTH): JSON OUTPUT -->
            <div class="panel json-panel">
                <div class="panel-header" style="margin-bottom: 16px; padding-bottom: 16px;">
                    <h2 class="panel-title"><i class="ph-fill ph-braces"></i> config.json Output</h2>
                    <div class="json-header-actions">
                        <button class="btn btn-primary" onclick="copyJSON()">
                            <i class="ph-bold ph-copy"></i> Copy Code
                        </button>
                        <button class="btn btn-outline" onclick="downloadJSON()">
                            <i class="ph-bold ph-download-simple"></i> Download .json
                        </button>
                    </div>
                </div>
                <pre class="json-output" id="jsonPreview">[]</pre>
            </div>

        </div>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        // --- AUTHENTICATION ---
        function handleLogin() {
            const user = document.getElementById('usernameInput').value.trim();
            if(user.length < 3) {
                alert("Username must be at least 3 characters!");
                return;
            }
            
            document.getElementById('displayUsername').innerText = user;
            
            document.getElementById('login-view').classList.remove('active');
            setTimeout(() => {
                document.getElementById('admin-view').classList.add('active');
                initData(); 
            }, 50);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') handleLogin();
        }

        function logout() {
            document.getElementById('admin-view').classList.remove('active');
            setTimeout(() => {
                document.getElementById('login-view').classList.add('active');
                document.getElementById('usernameInput').value = '';
            }, 50);
        }

        // --- DASHBOARD CRUD LOGIC ---
        let configData = [];
        const form = document.getElementById('dataForm');
        const inputType = document.getElementById('inputType');
        const editIndex = document.getElementById('editIndex');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        async function initData() {
            try {
                const response = await fetch('config.json?t=' + new Date().getTime());
                if(response.ok) {
                    configData = await response.json();
                }
            } catch(e) {
                console.log("No config.json found or running locally. Starting fresh.");
            }
            updateUI();
        }

        function toggleFields() {
            if (inputType.value === 'script') {
                document.getElementById('fieldFile').style.display = 'block';
                document.getElementById('fieldCode').style.display = 'none';
            } else {
                document.getElementById('fieldFile').style.display = 'none';
                document.getElementById('fieldCode').style.display = 'block';
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const newItem = {
                title: document.getElementById('inputTitle').value.trim(),
                description: document.getElementById('inputDesc').value.trim(),
                type: inputType.value
            };

            if(inputType.value === 'script') {
                let rawFile = document.getElementById('inputFile').value.trim();
                if(rawFile.startsWith('data/')) rawFile = rawFile.substring(5);
                newItem.file = "data/" + rawFile;
            } else {
                newItem.code = document.getElementById('inputCode').value.trim();
            }

            const currentIndex = parseInt(editIndex.value);
            
            if(currentIndex === -1) {
                configData.push(newItem);
            } else {
                configData[currentIndex] = newItem;
            }

            updateUI();
            resetForm();
        });

        function editItem(index) {
            const item = configData[index];
            editIndex.value = index;
            inputType.value = item.type || 'script';
            document.getElementById('inputTitle').value = item.title;
            document.getElementById('inputDesc').value = item.description || '';
            
            toggleFields();

            if(inputType.value === 'script') {
                let showFile = item.file || '';
                if(showFile.startsWith('data/')) showFile = showFile.substring(5);
                document.getElementById('inputFile').value = showFile;
            } else {
                document.getElementById('inputCode').value = item.code || '';
            }

            submitBtn.innerHTML = '<i class="ph-bold ph-check"></i> Save Changes';
            submitBtn.className = 'btn btn-warning'; // Change color to warning
            cancelBtn.style.display = 'flex';
            
            if(window.innerWidth <= 1024) form.scrollIntoView({behavior: "smooth", block: "start"});
        }

        function deleteItem(index) {
            if(confirm("Are you sure you want to delete this configuration?")) {
                configData.splice(index, 1);
                updateUI();
                resetForm();
            }
        }

        function resetForm() {
            form.reset();
            editIndex.value = -1;
            toggleFields();
            submitBtn.innerHTML = '<i class="ph-bold ph-plus-circle"></i> Add to Config';
            submitBtn.className = 'btn btn-primary';
            cancelBtn.style.display = 'none';
        }

        function updateUI() {
            const listContainer = document.getElementById('listContainer');
            listContainer.innerHTML = '';
            document.getElementById('totalItems').innerText = `${configData.length} Items`;

            if(configData.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color:var(--text-secondary); padding: 40px 20px;"><i class="ph-fill ph-package" style="font-size: 40px; margin-bottom: 12px; opacity:0.3;"></i><br>No configurations found. Add one!</div>';
            }

            configData.forEach((item, index) => {
                const isLoadstring = item.type === 'loadstring';
                const badge = isLoadstring ? 
                    '<span class="item-badge badge-loadstring">Loadstring</span>' : 
                    '<span class="item-badge badge-script">Script File</span>';
                
                const subtext = isLoadstring ? 
                    `<span class="item-path"><i class="ph-bold ph-link"></i> ${item.code.substring(0, 40)}${item.code.length > 40 ? '...' : ''}</span>` : 
                    `<span class="item-path"><i class="ph-bold ph-folder"></i> ${item.file}</span>`;

                listContainer.innerHTML += `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-header">
                                <h4>${item.title}</h4>
                                ${badge}
                            </div>
                            <p>${item.description || 'No description provided'}</p>
                            ${subtext}
                        </div>
                        <div class="item-actions">
                            <button class="edit-btn" onclick="editItem(${index})" title="Edit Data"><i class="ph-bold ph-pencil-simple"></i></button>
                            <button class="del-btn" onclick="deleteItem(${index})" title="Delete Data"><i class="ph-bold ph-trash"></i></button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('jsonPreview').textContent = JSON.stringify(configData, null, 4);
        }

        function importJSON() {
            const rawData = document.getElementById('importInput').value.trim();
            if(!rawData) return;
            try {
                const parsed = JSON.parse(rawData);
                if(Array.isArray(parsed)) {
                    configData = parsed;
                    updateUI();
                    alert("JSON Imported Successfully!");
                    document.getElementById('importInput').value = '';
                } else {
                    alert("Invalid Format. It must be a JSON Array [...]");
                }
            } catch (error) {
                alert("Failed to parse JSON. Please check your syntax.");
            }
        }

        function copyJSON() {
            const jsonText = document.getElementById('jsonPreview').textContent;
            navigator.clipboard.writeText(jsonText).then(() => {
                alert("JSON Code Copied to Clipboard!");
            });
        }

        function downloadJSON() {
            const jsonText = document.getElementById('jsonPreview').textContent;
            const blob = new Blob([jsonText], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "config.json";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
