<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FORKTV7 - Admin Panel</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            /* Warna Tepat Sesuai Referensi Gambar Mobile */
            --bg-base: #050505;
            --bg-panel-desktop: #0a0a0c;
            --bg-input: #121217;
            --bg-card: #0d0d12;
            
            --border-color: rgba(255, 255, 255, 0.05);
            --border-input: rgba(255, 255, 255, 0.08);
            
            /* Typography Colors */
            --text-primary: #f8fafc;
            --text-secondary: #8b949e;
            --text-muted: #525866;
            
            /* Accents (Sesuai Referensi) */
            --primary-purple: #8B5CF6;
            --purple-light: #A78BFA;
            --purple-bg: rgba(139, 92, 246, 0.1);
            
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            
            --warning: #f59e0b;
            
            /* Metrics */
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        /* Scrollbar Halus */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        /* ================= SPA VIEW STATES ================= */
        .view {
            display: none;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        .view.active {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* ================= 1. LOGIN SCREEN ================= */
        #login-view {
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: var(--bg-panel-desktop);
            border: 1px solid var(--border-color);
            padding: 40px 32px;
            border-radius: var(--radius-lg);
            width: 100%; max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .login-logo {
            width: 64px; height: 64px;
            background: var(--primary-purple);
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 800; color: #fff;
            margin: 0 auto 24px auto;
        }
        .login-card h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .login-card p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 32px; }
        
        .input-group-auth { position: relative; margin-bottom: 24px; }
        .input-group-auth i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: var(--text-secondary); font-size: 20px;
        }
        .input-group-auth input {
            width: 100%; background: var(--bg-input);
            border: 1px solid var(--border-input);
            padding: 16px 16px 16px 48px; border-radius: var(--radius-md);
            color: var(--text-primary); font-size: 1rem; outline: none; transition: 0.3s;
        }
        .input-group-auth input:focus { border-color: var(--primary-purple); }

        .btn-login {
            width: 100%; padding: 16px;
            background: var(--primary-purple); color: #fff;
            border: none; border-radius: var(--radius-md);
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.2s;
        }

        /* ================= 2. DASHBOARD NAV ================= */
        .topbar {
            height: 65px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 32px; position: sticky; top: 0; z-index: 50;
        }
        .topbar-brand { display: flex; align-items: center; gap: 12px; }
        .logo-mini {
            background: var(--primary-purple); width: 34px; height: 34px;
            border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 14px;
        }
        .topbar-brand span { font-weight: 700; font-size: 1.1rem; }

        .topbar-user { display: flex; align-items: center; gap: 20px; }
        .user-info { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
        .user-info i { font-size: 24px; color: var(--text-primary); }

        .btn-logout {
            background: var(--danger-bg); color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 8px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }

        /* ================= DASHBOARD LAYOUT (DESKTOP BASE) ================= */
        .dashboard-container {
            max-width: 1300px; margin: 0 auto; width: 100%;
            padding: 32px; display: grid; gap: 24px;
            grid-template-columns: 400px 1fr;
            align-items: start;
        }

        .panel {
            background: var(--bg-panel-desktop);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); padding: 24px;
            display: flex; flex-direction: column;
        }
        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);
        }
        .panel-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .panel-title i { color: var(--primary-purple); font-size: 22px; }

        /* Formulir Entry */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: flex; justify-content: space-between;
            font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500;
        }

        input, textarea, select {
            width: 100%; background: var(--bg-input);
            border: 1px solid transparent; color: var(--text-primary);
            padding: 14px 16px; border-radius: var(--radius-md); font-size: 0.95rem; outline: none; transition: 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--border-color);
        }

        /* Group Prefix 'data/' persis foto */
        .input-group {
            display: flex; align-items: stretch;
            background: var(--bg-input); border-radius: var(--radius-md);
            border: 1px solid transparent; overflow: hidden;
        }
        .input-group:focus-within { border-color: var(--border-color); }
        .input-group-prefix {
            padding: 14px 16px; color: var(--text-secondary);
            background: rgba(0,0,0,0.3); border-right: 1px solid var(--border-color);
            display: flex; align-items: center; font-size: 0.95rem;
        }
        .input-group input { border: none; background: transparent; border-radius: 0; }
        .input-group input:focus { border: none; }

        /* Tombol */
        .btn {
            padding: 16px; border: none; border-radius: var(--radius-md);
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: 0.2s;
        }
        .btn-primary { background: var(--primary-purple); color: #fff; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-outline { background: transparent; border: 1px solid var(--border-input); color: var(--text-primary); }

        /* List Konfigurasi */
        .list-container {
            display: flex; flex-direction: column; gap: 12px;
            max-height: 550px; overflow-y: auto; padding-right: 4px; margin-bottom: 20px;
        }
        .list-item {
            background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 20px; border-radius: var(--radius-lg); 
            display: flex; flex-direction: column; gap: 12px; transition: 0.2s;
        }
        
        .item-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .item-title { font-size: 1.1rem; font-weight: 700; color: #fff; }
        
        .item-badge {
            font-size: 0.65rem; font-weight: 800; padding: 4px 8px; border-radius: 6px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge-script { background: var(--purple-bg); color: var(--purple-light); }
        .badge-loadstring { background: var(--success-bg); color: var(--success); }

        .item-desc { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.4; }
        
        .item-path { 
            font-size: 0.8rem; color: var(--purple-light); font-family: 'Fira Code', monospace; 
            display: inline-flex; align-items: center; gap: 8px; background: rgba(168, 85, 247, 0.05);
            padding: 8px 12px; border-radius: 8px; word-break: break-all; border: 1px dashed rgba(168, 85, 247, 0.2);
            margin-top: 4px;
        }

        .item-actions { 
            display: flex; gap: 8px; margin-top: 8px; 
            border-top: 1px solid var(--border-color); padding-top: 16px;
        }
        .item-actions button {
            background: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: var(--radius-sm); color: var(--text-primary); font-size: 1rem;
            cursor: pointer; padding: 10px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
        }

        .count-badge {
            background: var(--bg-input); border: 1px solid var(--border-color);
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: var(--text-primary);
        }

        /* JSON Output Panel */
        .json-panel { grid-column: 1 / -1; }
        .json-header-actions { display: flex; gap: 12px; }
        .json-header-actions button { padding: 10px 16px; font-size: 0.85rem; border-radius: var(--radius-sm); width: auto;}
        .json-output {
            background: #09090b; border: 1px solid var(--border-color); border-radius: var(--radius-md);
            padding: 20px; font-family: 'Fira Code', monospace; font-size: 0.85rem;
            color: #34d399; max-height: 400px; overflow-y: auto; overflow-x: auto;
        }

        /* ================= DETEKSI OTOMATIS (RESPONSIVE MOBILE) ================= */
        @media (max-width: 800px) {
            /* Topbar Compact */
            .topbar { padding: 0 16px; height: 60px; }
            .topbar-brand span { display: none; } /* Sembunyikan text logo */
            .user-info span { display: none; } /* Sembunyikan nama user */
            
            /* Container Merapat ke Tepi */
            .dashboard-container {
                grid-template-columns: 1fr; 
                padding: 16px; gap: 24px;
            }

            /* Hapus Background/Border Panel agar menyatu dengan body persis seperti difoto */
            .panel {
                background: transparent;
                border: none;
                padding: 0;
            }
            .panel-header {
                flex-direction: column; align-items: flex-start;
                border-bottom: none; gap: 12px; margin-bottom: 16px; padding-bottom: 0;
            }
            
            /* Pill Item sejajar kiri bawah judul */
            .count-badge { align-self: flex-start; }
            
            /* Action Button List merata 50/50 */
            .item-actions { flex-direction: row; }
            .item-actions button { font-size: 0.9rem; padding: 12px; }
            
            .json-header-actions { flex-direction: column; width: 100%; }
            .json-header-actions button { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-view" class="view active">
        <div class="login-card">
            <div class="login-logo">F7</div>
            <h1>FORKTV7</h1>
            <p>Admin Studio Authentication</p>
            
            <div class="input-group-auth">
                <i class="ph-bold ph-user"></i>
                <input type="text" id="usernameInput" placeholder="Enter Username..." autocomplete="off" onkeypress="handleEnter(event)">
            </div>
            
            <button class="btn-login" onclick="handleLogin()">
                Access Dashboard
            </button>
        </div>
    </div>


    <!-- ADMIN DASHBOARD -->
    <div id="admin-view" class="view">
        
        <!-- Top Navigation -->
        <nav class="topbar">
            <div class="topbar-brand">
                <div class="logo-mini">F7</div>
                <span>FORKTV7 Admin</span>
            </div>
            <div class="topbar-user">
                <div class="user-info">
                    <i class="ph-fill ph-user-circle"></i>
                    <span id="displayUsername">Admin</span>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="ph-bold ph-sign-out"></i> <span>Logout</span>
                </button>
            </div>
        </nav>

        <!-- Main Layout -->
        <div class="dashboard-container">
            
            <!-- COLUMN 1: ENTRY FORM -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title"><i class="ph-fill ph-pencil-line"></i> Entry Data</h2>
                </div>
                
                <form id="dataForm">
                    <input type="hidden" id="editIndex" value="-1">
                    
                    <div class="form-group">
                        <label>Execution Type</label>
                        <select id="inputType" onchange="toggleFields()">
                            <option value="script">Local File (.lua)</option>
                            <option value="loadstring">Remote Code (Loadstring)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Title / Script Name</label>
                        <input type="text" id="inputTitle" placeholder="Ex: Auto Farm V2" required>
                    </div>

                    <div class="form-group">
                        <label>Description (Optional)</label>
                        <input type="text" id="inputDesc" placeholder="Brief explanation">
                    </div>

                    <!-- Input Local File -->
                    <div class="form-group" id="fieldFile">
                        <label>Filename (.lua)</label>
                        <div class="input-group">
                            <div class="input-group-prefix">data/</div>
                            <input type="text" id="inputFile" placeholder="Ex: autofarm.lua">
                        </div>
                    </div>

                    <!-- Input Loadstring -->
                    <div class="form-group" id="fieldCode" style="display: none;">
                        <label>Loadstring URL/Code</label>
                        <textarea id="inputCode" rows="3" placeholder="loadstring(game:HttpGet('...'))()"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="ph-bold ph-plus-circle"></i> Add to Config
                    </button>
                    <button type="button" class="btn btn-outline" style="margin-top: 12px; display: none;" id="cancelBtn" onclick="resetForm()">
                        Cancel Edit
                    </button>
                </form>
            </div>

            <!-- COLUMN 2: ACTIVE LIST -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title"><i class="ph-fill ph-list-bullets"></i> Active Configurations</h2>
                    <span class="count-badge" id="totalItems">0 Items</span>
                </div>
                
                <div class="list-container" id="listContainer">
                    <!-- Data List Injected Here -->
                </div>
            </div>

            <!-- COLUMN 3: JSON OUTPUT -->
            <div class="panel json-panel">
                <div class="panel-header">
                    <h2 class="panel-title"><i class="ph-fill ph-braces"></i> config.json Output</h2>
                    <div class="json-header-actions">
                        <button class="btn btn-primary" style="padding: 10px 20px" onclick="copyJSON()">
                            <i class="ph-bold ph-copy"></i> Copy Code
                        </button>
                        <button class="btn btn-outline" style="padding: 10px 20px" onclick="downloadJSON()">
                            <i class="ph-bold ph-download-simple"></i> Download
                        </button>
                    </div>
                </div>
                <pre class="json-output" id="jsonPreview">[]</pre>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- AUTHENTICATION ---
        function handleLogin() {
            const user = document.getElementById('usernameInput').value.trim();
            if(user.length < 3) {
                alert("Username must be at least 3 characters!");
                return;
            }
            
            document.getElementById('displayUsername').innerText = user;
            document.getElementById('login-view').classList.remove('active');
            
            setTimeout(() => {
                document.getElementById('admin-view').classList.add('active');
                initData(); 
            }, 50);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') handleLogin();
        }

        function logout() {
            document.getElementById('admin-view').classList.remove('active');
            setTimeout(() => {
                document.getElementById('login-view').classList.add('active');
                document.getElementById('usernameInput').value = '';
            }, 50);
        }

        // --- DASHBOARD LOGIC ---
        let configData = [];
        const form = document.getElementById('dataForm');
        const inputType = document.getElementById('inputType');
        const editIndex = document.getElementById('editIndex');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        async function initData() {
            try {
                const response = await fetch('config.json?t=' + new Date().getTime());
                if(response.ok) {
                    configData = await response.json();
                }
            } catch(e) {
                console.log("No config.json found. Starting fresh.");
            }
            updateUI();
        }

        function toggleFields() {
            if (inputType.value === 'script') {
                document.getElementById('fieldFile').style.display = 'block';
                document.getElementById('fieldCode').style.display = 'none';
            } else {
                document.getElementById('fieldFile').style.display = 'none';
                document.getElementById('fieldCode').style.display = 'block';
            }
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const newItem = {
                title: document.getElementById('inputTitle').value.trim(),
                description: document.getElementById('inputDesc').value.trim(),
                type: inputType.value
            };

            if(inputType.value === 'script') {
                let rawFile = document.getElementById('inputFile').value.trim();
                if(rawFile.startsWith('data/')) rawFile = rawFile.substring(5);
                newItem.file = "data/" + rawFile;
            } else {
                newItem.code = document.getElementById('inputCode').value.trim();
            }

            const currentIndex = parseInt(editIndex.value);
            
            if(currentIndex === -1) {
                configData.push(newItem);
            } else {
                configData[currentIndex] = newItem;
            }

            updateUI();
            resetForm();
        });

        function editItem(index) {
            const item = configData[index];
            editIndex.value = index;
            inputType.value = item.type || 'script';
            document.getElementById('inputTitle').value = item.title;
            document.getElementById('inputDesc').value = item.description || '';
            
            toggleFields();

            if(inputType.value === 'script') {
                let showFile = item.file || '';
                if(showFile.startsWith('data/')) showFile = showFile.substring(5);
                document.getElementById('inputFile').value = showFile;
            } else {
                document.getElementById('inputCode').value = item.code || '';
            }

            submitBtn.innerHTML = '<i class="ph-bold ph-check"></i> Save Changes';
            submitBtn.style.background = 'var(--warning)';
            submitBtn.style.color = '#000';
            cancelBtn.style.display = 'flex';
            
            if(window.innerWidth <= 800) form.scrollIntoView({behavior: "smooth", block: "start"});
        }

        function deleteItem(index) {
            if(confirm("Are you sure you want to delete this configuration?")) {
                configData.splice(index, 1);
                updateUI();
                resetForm();
            }
        }

        function resetForm() {
            form.reset();
            editIndex.value = -1;
            toggleFields();
            submitBtn.innerHTML = '<i class="ph-bold ph-plus-circle"></i> Add to Config';
            submitBtn.style.background = 'var(--primary-purple)';
            submitBtn.style.color = '#fff';
            cancelBtn.style.display = 'none';
        }

        function updateUI() {
            const listContainer = document.getElementById('listContainer');
            listContainer.innerHTML = '';
            document.getElementById('totalItems').innerText = `${configData.length} Items`;

            if(configData.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color:var(--text-secondary); padding: 40px 20px;">No configurations found.</div>';
            }

            configData.forEach((item, index) => {
                const isLoadstring = item.type === 'loadstring';
                const badge = isLoadstring ? 
                    '<span class="item-badge badge-loadstring">LOADSTRING</span>' : 
                    '<span class="item-badge badge-script">LOCAL FILE</span>';
                
                const subtext = isLoadstring ? 
                    `<div class="item-path"><i class="ph-bold ph-link"></i> ${item.code.substring(0, 35)}${item.code.length > 35 ? '...' : ''}</div>` : 
                    `<div class="item-path"><i class="ph-bold ph-folder"></i> ${item.file}</div>`;

                listContainer.innerHTML += `
                    <div class="list-item">
                        <div class="item-header">
                            <span class="item-title">${item.title}</span>
                            ${badge}
                        </div>
                        <p class="item-desc">${item.description || 'No description provided'}</p>
                        ${subtext}
                        <div class="item-actions">
                            <button onclick="editItem(${index})"><i class="ph-bold ph-pencil-simple"></i> Edit</button>
                            <button onclick="deleteItem(${index})" style="color:var(--danger)"><i class="ph-bold ph-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('jsonPreview').textContent = JSON.stringify(configData, null, 4);
        }

        function copyJSON() {
            navigator.clipboard.writeText(document.getElementById('jsonPreview').textContent).then(() => {
                alert("JSON Code Copied to Clipboard!");
            });
        }

        function downloadJSON() {
            const blob = new Blob([document.getElementById('jsonPreview').textContent], { type: "application/json" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "config.json";
            link.click();
        }
    </script>
</body>
</html>
